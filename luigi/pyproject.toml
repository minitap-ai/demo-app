[project]
name = "luigi"
version = "1.0.0"
description = "Luigi's Pizzeria: order API and web phone line for the Minitap voice-agent demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
